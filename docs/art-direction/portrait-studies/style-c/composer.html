<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风云南北朝 · 五官组合样板</title>
<style>
:root{color-scheme:dark;--ink:#172821;--paper:#f4eee2;--text:#e9dfcb;--muted:#bfc3af;--gold:#c4ae80;--rule:#68715a}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:15px/1.7 system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:26px 30px 48px}header{position:relative;border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:24px}h1,h2{font-family:"Songti SC","Noto Serif SC",serif;font-weight:500}h1{font-size:34px;letter-spacing:.06em;margin:4px 0}h2{font-size:22px;margin:18px 0 12px}header p{margin:5px 0;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.16em}a{color:var(--gold)}header a{position:absolute;right:0;top:24px}.workbench{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:42px}.portrait-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}.portrait-canvas{min-height:300px;background:var(--paper);display:flex;align-items:flex-start;justify-content:center}.portrait-canvas canvas{display:block;width:100%;height:auto;max-height:690px;object-fit:contain}.portrait-canvas[aria-busy=true]{opacity:.65}#portrait-status{font-size:13px;color:var(--muted);margin:9px 0;min-height:24px}aside h2:first-child{margin-top:0}.feature-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.select-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--muted)}select,button{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:9px 13px}button,select{cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);width:100%;margin-top:16px}.family{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.family button{padding:0 0 8px;overflow:hidden}.family button[aria-pressed=true]{outline:2px solid var(--gold);outline-offset:2px}.family-face{display:block;aspect-ratio:18/19;min-height:70px;background:var(--paper);color:var(--ink);margin-bottom:6px}.family canvas{display:block;width:100%;height:auto}.quiet,details{font-size:12px;color:var(--muted)}details{border-top:1px solid var(--rule);padding-top:10px}summary{cursor:pointer}.quiet{margin:10px 0 16px}@media(max-width:800px){main{padding:20px}.workbench{grid-template-columns:1fr;gap:26px}.portrait-panel{max-width:560px;width:100%;margin:auto}header a{position:static}h1{font-size:28px}.portrait-canvas canvas{max-height:540px}}
</style></head><body><main id="portrait-study"><p role="status">正在载入五官组合样板…</p></main><noscript>请启用 JavaScript 查看组合样板。</noscript><script type="module" src="/src/ui/portraitStudy.ts"></script></body></html>
